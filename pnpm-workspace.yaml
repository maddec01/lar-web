packages:
    - packages/*
    - templates/*

# Vite+ ships its own Vite. Point every dependent (Storybook, the React plugin) at that copy.
overrides:
    vite: npm:@voidzero-dev/vite-plus-core@1.5.0

# Vite+ ships Vite as @voidzero-dev/vite-plus-core, which plugins don't recognise as vite.
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'

allowBuilds:
    esbuild: true

# pnpm waits a day before installing a new release; Lar's own packages are trusted as soon as they're out.
minimumReleaseAgeExclude:
    - '@lar-works/*'
