# Publishes the design system's Storybook to GitHub Pages from main.
name: Storybook

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - uses: actions/configure-pages@v6
            - name: Build Storybook
              run: pnpm --filter @lar-works/design-system build-storybook
              env:
                  STORYBOOK_BASE: /lar-web/
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: packages/design-system/storybook-static

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
