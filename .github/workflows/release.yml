# On main, Changesets either opens the "Version packages" PR (bumping versions and changelogs from the pending
# changesets) or, once that PR is merged, publishes the new versions to npm with provenance and tags them.
name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Version or publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - name: Version or publish
              uses: changesets/action@v2
              with:
                  version: pnpm exec changeset version
                  publish: pnpm release
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
