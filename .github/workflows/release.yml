# On main, Changesets either opens the "Version packages" PR (bumping versions and changelogs from the pending
# changesets) or, once that PR is merged, releases each new version as a GitHub Release with the package tarball
# attached (scripts/release.mjs). Apps install those tarballs by URL; no registry or token is involved. To move an
# app to a new release, change the version in its package.json URL and run pnpm install.
name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Version or release
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - name: Version or release
              uses: changesets/action@v2
              with:
                  version: pnpm exec changeset version
                  publish: pnpm release
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
