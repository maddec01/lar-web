# On main, Changesets either opens the "Version packages" PR (bumping versions and changelogs from the pending
# changesets) or, once that PR is merged, publishes the new versions to npm (scripts/release.mjs) and creates a GitHub
# Release for each. npm trusts this workflow through trusted publishing (OIDC), so no npm token is stored.
name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Version or publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - name: Version or publish
              uses: changesets/action@v2
              with:
                  version-script: pnpm exec changeset version
                  publish-script: pnpm release
                  commit-message: 'chore: version packages'
                  pr-title: 'chore: version packages'
                  create-github-releases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
