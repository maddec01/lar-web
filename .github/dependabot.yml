version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      ignore:
          # @types/node follows the Node major in .node-version.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
      groups:
          storybook:
              patterns: ['storybook', '@storybook/*']
          toolchain:
              patterns: ['vite-plus', '@voidzero-dev/*', 'typescript', '@types/*']
          ninna-ui:
              patterns: ['@ninna-ui/*']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
